<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Planilla de mantenimiento</title>
<style>
:root{--bg:#eef0f2;--card:#fff;--ink:#1c2430;--mu:#5f6b78;--bd:#cdd3da;--head:#2b3a4a;--acc:#f2a900;--acct:#1c2430;--ok:#1a7f37;--wa:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1b222b;--ink:#e8ebee;--mu:#98a3af;--bd:#2f3a46;--head:#0d1218;--ok:#3fb950;--wa:#e3b341}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:18px}header small{display:block;opacity:.75;font-size:13px}
header button{background:transparent;color:#fff;border:1px solid #ffffff55;padding:7px 12px}
main{max-width:640px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
button,input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:11px 10px;min-height:44px}
button{cursor:pointer}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:var(--acct);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px}
form{display:grid;gap:8px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.it{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--bd);padding:10px 0}
.it:first-child{border-top:0}.it small,.mu{color:var(--mu)}.mu{font-size:14px}
.st{font-size:13px;padding:6px 10px;min-height:36px;white-space:nowrap}
.Hecha{color:var(--ok)}.En{color:var(--wa)}
.err{color:#c62828;font-size:14px;min-height:20px}
h2{font-size:18px;margin:6px 0 12px}
</style>
</head>
<body>
<div id="app"><main><p class="mu">Cargando…</p></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,addDoc,doc,getDoc,updateDoc,deleteDoc,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Configuración del proyecto Firebase Planillas-Tecnicos */
const firebaseConfig={
  apiKey:"AIzaSyB_s0YJBkYx_C0_AKzjBFF6Fygu7CNE1HA",
  authDomain:"planillas-tecnicos.firebaseapp.com",
  projectId:"planillas-tecnicos",
  storageBucket:"planillas-tecnicos.firebasestorage.app",
  messagingSenderId:"877056517148",
  appId:"1:877056517148:web:9fff9a1740603285d82bd9"
};

const LINEAS=['Negro','Blanco','Mousse','Maicena','Conos','Galletas','Moldeo','Chips','Duyvis','Packint','Expedición','Depósito','Orgánicos','Otro'];
const TIPOS=['Productivo','Correctivo','Preventivo'];
const ESTADOS=['Pendiente','En curso','Hecha'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=()=>new Date().toLocaleDateString('en-CA');

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(firebaseConfig.apiKey.startsWith('PEGAR')){
  $('#app').innerHTML='<main><div class="card"><h2>Falta configurar Firebase</h2><p>Abrí index.html y pegá los datos de tu proyecto en firebaseConfig.</p></div></main>';
  throw new Error('Firebase sin configurar');
}
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

let me=null,tab='mi',filtro=hoy(),tareas=[],unsub=null;
const isSup=()=>me?.rol==='supervisor';

function vistaLogin(msg=''){
  $('#app').innerHTML=`<header><b>Planilla de mantenimiento</b></header><main>
  <form id="login" class="card"><h2>Ingresar</h2>
  <input type="email" name="email" placeholder="Correo" autocomplete="username" required>
  <input type="password" name="pass" placeholder="Contraseña" autocomplete="current-password" required>
  <div class="err" id="err">${esc(msg)}</div>
  <button class="pri">Ingresar</button></form></main>`;
}

function shell(){
  $('#app').innerHTML=`<header><div><b>${esc(me.nombre||'Técnico')}</b><small>${isSup()?'Supervisor':'Técnico'}</small></div><button data-out>Salir</button></header><main>
  ${isSup()?`<div class="tabs"><button data-tab="mi" class="${tab=='mi'?'on':''}">Mi planilla</button><button data-tab="eq" class="${tab=='eq'?'on':''}">Equipo</button></div>`:''}
  ${tab=='mi'?`<form id="f" class="card"><h2>Nueva tarea</h2>
    <input type="date" name="fecha" value="${hoy()}" required>
    <div class="row"><select name="linea" required><option value="" disabled selected>Línea</option>${LINEAS.map(l=>`<option>${l}</option>`).join('')}</select>
    <input name="equipo" placeholder="Equipo" required></div>
    <select name="tipo" required><option value="" disabled selected>Tipo de trabajo</option>${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select>
    <input name="tarea" placeholder="Tarea realizada" required>
    <textarea name="notas" rows="2" placeholder="Notas (opcional)"></textarea>
    <select name="estado">${ESTADOS.map(e=>`<option>${e}</option>`).join('')}</select>
    <button class="pri">Guardar tarea</button></form>`
  :`<div class="card"><input type="date" id="fd" value="${filtro}"></div>`}
  <div id="lista"></div></main>`;
  suscribir();
}

function suscribir(){
  unsub&&unsub();
  const q=tab=='mi'?query(collection(db,'tareas'),where('uid','==',me.uid)):query(collection(db,'tareas'),where('fecha','==',filtro));
  unsub=onSnapshot(q,s=>{tareas=s.docs.map(d=>({_id:d.id,...d.data()}));lista()},()=>{const L=$('#lista');if(L)L.textContent='Sin acceso a los datos.'});
}

function item(e,propia){
  const c=e.estado=='Hecha'?'Hecha':e.estado=='En curso'?'En':'';
  const acc=propia?`<button class="st ${c}" data-st="${e._id}" data-cur="${esc(e.estado)}">${esc(e.estado)}</button> <button class="st" data-del="${e._id}" aria-label="Borrar">✕</button>`
    :`<span class="st ${c}">${esc(e.estado)}</span>${isSup()?` <button class="st" data-del="${e._id}" aria-label="Borrar">✕</button>`:''}`;
  return `<div class="it"><div><b>${esc(e.linea)} › ${esc(e.equipo)}</b>: ${esc(e.tarea)}<br><small>${esc(e.fecha)} · ${esc(e.tipo)}${e.notas?' · '+esc(e.notas):''}</small></div><div>${acc}</div></div>`;
}

function lista(){
  const L=$('#lista');if(!L)return;
  if(tab=='mi'){
    const m=tareas.slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
    L.innerHTML=m.length?`<div class="card">${m.map(e=>item(e,true)).join('')}</div>`:'<p class="mu">Todavía no cargaste tareas.</p>';
    return;
  }
  const por={};tareas.forEach(e=>{(por[e.uid]=por[e.uid]||{n:e.nombre,es:[]}).es.push(e)});
  const g=Object.values(por);
  if(!g.length){L.innerHTML='<p class="mu">Sin tareas cargadas para esa fecha.</p>';return}
  const ok=tareas.filter(e=>e.estado=='Hecha').length;
  const tipos=TIPOS.map(t=>`${t}: ${tareas.filter(e=>e.tipo==t).length}`).join(' · ');
  L.innerHTML=`<p class="mu">${tareas.length} tareas · ${ok} hechas · ${g.length} técnicos<br>${tipos}</p>`+
    g.map(x=>`<div class="card"><b>${esc(x.n||'Técnico')}</b>${x.es.sort((a,b)=>(a.ts||0)-(b.ts||0)).map(e=>item(e,false)).join('')}</div>`).join('');
}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if('out' in t.dataset){signOut(auth);return}
  if(t.dataset.tab){tab=t.dataset.tab;shell();return}
  try{
    if(t.dataset.st){await updateDoc(doc(db,'tareas',t.dataset.st),{estado:ESTADOS[(ESTADOS.indexOf(t.dataset.cur)+1)%3]})}
    if(t.dataset.del&&confirm('¿Borrar esta tarea?')){await deleteDoc(doc(db,'tareas',t.dataset.del))}
  }catch(e){alert('No se pudo completar la acción.')}
});

document.addEventListener('submit',async ev=>{
  ev.preventDefault();
  const f=ev.target;
  if(f.id=='login'){
    $('#err').textContent='';
    try{await signInWithEmailAndPassword(auth,f.email.value.trim(),f.pass.value)}
    catch(e){$('#err').textContent='Correo o contraseña incorrectos.'}
    return;
  }
  if(f.id=='f'){
    const d=Object.fromEntries(new FormData(f));
    addDoc(collection(db,'tareas'),{...d,uid:me.uid,nombre:me.nombre||'',ts:Date.now()}).catch(()=>alert('No se pudo guardar la tarea.'));
    f.reset();f.fecha.value=hoy();
  }
});
document.addEventListener('change',ev=>{if(ev.target.id=='fd'&&ev.target.value){filtro=ev.target.value;suscribir()}});

onAuthStateChanged(auth,async u=>{
  unsub&&unsub();unsub=null;tareas=[];me=null;
  if(!u)return vistaLogin();
  try{
    const s=await getDoc(doc(db,'usuarios',u.uid));
    if(!s.exists()){await signOut(auth);return vistaLogin('Tu usuario todavía no está habilitado. Avisale a tu supervisor.')}
    me={uid:u.uid,...s.data()};tab='mi';shell();
  }catch(e){await signOut(auth);vistaLogin('No se pudo cargar tu usuario. Revisá la conexión e intentá de nuevo.')}
});
</script>
</body>
</html>
